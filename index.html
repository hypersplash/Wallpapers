<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Test Page</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5em;
    }

    p {
      opacity: 0.8;
    }

    button {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      margin-top: 1em;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s ease;
    }

    button:hover {
      background: #2ea043;
    }
  </style>
</head>
<body>
  <h1>🚀 HTML Test Page</h1>
  <p>If you can see this, HTML + CSS are working fine!</p>
  <button onclick="alert('JavaScript works too! 🎉')">Test JS</button>
</body>
</html>
